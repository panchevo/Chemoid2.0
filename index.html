<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Химоид — Android</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #1e2b3c;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .table-panel {
            width: 280px;
            min-width: 200px;
            background: #0f1a26;
            padding: 8px 6px;
            overflow-y: auto;
            border-right: 2px solid #3a4c5e;
            box-shadow: 2px 0 12px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 10;
            flex-shrink: 0;
        }
        .table-panel h3 {
            color: #b0d0e0;
            text-align: center;
            font-weight: 300;
            letter-spacing: 1px;
            font-size: 14px;
            margin-bottom: 6px;
            border-bottom: 1px solid #2a4050;
            padding-bottom: 6px;
        }
        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 1.5px;
            background: #0f1a26;
        }
        .element-cell {
            aspect-ratio: 1 / 1;
            background: #1a2a38;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 600;
            color: #d4eaf5;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 0 0 1px #2a4050;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
            line-height: 1;
            padding: 1px;
        }
        .element-cell .el-number { font-size: 5px; color: #6a8a9a; font-weight: 400; }
        .element-cell .el-symbol { font-size: 11px; font-weight: 700; color: #e6f3fa; }
        .element-cell .el-name { font-size: 4.5px; color: #8aacbe; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .element-cell:active { transform: scale(0.9); background: #2a4a5e; }

        .element-cell.nonmetal { background: #1a3a2a; }
        .element-cell.noble-gas { background: #2a2a4a; }
        .element-cell.alkali { background: #3a2a2a; }
        .element-cell.alkaline-earth { background: #3a2a3a; }
        .element-cell.metalloid { background: #2a3a2a; }
        .element-cell.halogen { background: #2a2a3a; }
        .element-cell.transition { background: #1a2a3a; }
        .element-cell.lanthanide { background: #2a1a3a; }
        .element-cell.actinide { background: #2a1a2a; }
        .element-cell.post-transition { background: #1a2a2a; }

        .coefficient-panel {
            margin-top: 8px;
            padding: 6px 2px;
            background: #0a1722;
            border-radius: 6px;
            border: 1px solid #1a3040;
        }
        .coefficient-panel .label {
            color: #7a9aaa;
            font-size: 10px;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .coefficient-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 3px;
        }
        .coeff-cell {
            aspect-ratio: 1 / 1;
            background: #1a2a38;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #ffd866;
            cursor: pointer;
            box-shadow: 0 0 0 1px #2a4050;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
        }
        .coeff-cell:active { background: #2a4a5e; transform: scale(0.9); }

        .workspace {
            flex: 1;
            background: #1b2a36;
            position: relative;
            overflow: hidden;
            background-image: radial-gradient(circle at 20% 30%, #2a4050 1px, transparent 1px), radial-gradient(circle at 80% 70%, #2a4050 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            touch-action: none;
        }
        .chem-object {
            position: absolute;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #e6f3fa;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            cursor: grab;
            display: inline-block;
            white-space: nowrap;
            transition: filter 0.1s, transform 0.1s;
            background: transparent;
            border: none;
            pointer-events: auto;
            z-index: 20;
            touch-action: none;
        }
        .chem-object.dragging {
            cursor: grabbing;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
            z-index: 100;
            transform: scale(1.08);
        }
        .chem-object.compound {
            color: #ffd866;
            font-size: 13px;
            background: rgba(255, 216, 102, 0.08);
            border: 1px solid rgba(255, 216, 102, 0.15);
            padding: 3px 10px;
        }
        .chem-object.mega-compound {
            color: #ff8a8a;
            font-size: 12px;
            background: rgba(255, 138, 138, 0.08);
            border: 1px solid rgba(255, 138, 138, 0.15);
            padding: 3px 10px;
        }
        .chem-object.alloy {
            color: #80d0ff;
            font-size: 13px;
            background: rgba(128, 208, 255, 0.08);
            border: 1px solid rgba(128, 208, 255, 0.15);
            padding: 3px 10px;
        }
        .chem-object.reject {
            color: #ff5555 !important;
            background: rgba(255, 50, 50, 0.25) !important;
            border: 1px solid #ff3333 !important;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        .chem-object.coefficient {
            color: #ffd866;
            font-size: 18px;
            font-weight: 800;
            background: rgba(255, 216, 102, 0.15);
            border: 2px solid #ffd866;
            padding: 2px 12px;
            border-radius: 12px;
            min-width: 36px;
            text-align: center;
            cursor: grab;
            box-shadow: 0 0 20px rgba(255, 216, 102, 0.2);
        }
        .info-bar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a1a22cc;
            backdrop-filter: blur(6px);
            color: #b0d0e0;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid #2a5060;
            pointer-events: none;
            z-index: 200;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .info-bar span { color: #8fcbff; font-weight: 600; }
        .info-bar .compound-count { color: #ffd866; }

        .clear-btn {
            background: #1a3040;
            border: 1px solid #3a5a6e;
            color: #b0d0e0;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            margin-top: 6px;
            width: 100%;
        }
        .clear-btn:active { background: #2a4a5e; }
        .stats-bar {
            color: #5a7a8a;
            font-size: 10px;
            text-align: center;
            padding: 4px 0;
            border-top: 1px solid #1a3040;
            margin-top: 4px;
        }
        .stats-bar span { color: #8fcbff; }

        .table-panel::-webkit-scrollbar { width: 3px; }
        .table-panel::-webkit-scrollbar-track { background: #0f1a26; }
        .table-panel::-webkit-scrollbar-thumb { background: #3a5a6e; border-radius: 10px; }

        @media (max-width: 600px) {
            .table-panel { width: 200px; min-width: 140px; padding: 4px; }
            .element-cell .el-symbol { font-size: 9px; }
            .element-cell .el-name { display: none; }
            .element-cell .el-number { font-size: 4px; }
            .coefficient-panel .label { font-size: 8px; }
            .coeff-cell { font-size: 11px; }
            .chem-object { font-size: 13px; padding: 3px 8px; }
            .chem-object.compound { font-size: 11px; }
            .info-bar { font-size: 10px; padding: 4px 12px; }
        }
        @media (max-width: 400px) {
            .table-panel { width: 160px; min-width: 120px; }
            .element-cell .el-symbol { font-size: 7px; }
            .periodic-grid { gap: 1px; }
        }
    </style>
</head>

    <div class="table-panel">

        <div class="periodic-grid" id="periodicGrid"></div>

            <div class="label">📊 КОЭФФИЦИЕНТЫ</div>

    <div class="workspace" id="workspace">

                        const mname = elementData[metals[0]]?.rus || metals[0];
                        const nm = nonMetals[0];
                        const suf = { 'Cl':'хлорид','F':'фторид','O':'оксид','S':'сульфид','N':'нитрид','C':'карбид' };
                        const suffix = suf[nm] || (elementData[nm]?.rus || nm) + 'ид';
                        const p = { '1':'','2':'ди','3':'три','4':'тетра','5':'пента' };
                        return suffix + ' ' + (p[counts[metals[0]]] || '') + mname;
                    }
                }
                if (typeInfo.type === 'гидрид' || typeInfo.type === 'металлогидрид') {
                    const other = unique.find(s => s !== 'H');
                    if (other) {
                        const oname = elementData[other]?.rus || other;
                        const p = { '1':'','2':'ди','3':'три','4':'тетра' };
                        return (p[counts['H']] || '') + 'гидрид ' + oname;
                    }
                }
                if (typeInfo.type === 'галогенид') {
                    const other = unique.find(s => s !== 'Cl' && s !== 'F' && s !== 'Br' && s !== 'I');
                    if (other) {
                        const oname = elementData[other]?.rus || other;
                        let hal = '';
                        if (hasCl) hal = 'хлорид'; else if (hasF) hal = 'фторид'; else if (hasBr) hal = 'бромид'; else if (hasI) hal = 'иодид';
                        const p = { '1':'','2':'ди','3':'три','4':'тетра' };
                        return (p[counts[hasCl?'Cl':hasF?'F':hasBr?'Br':'I']] || '') + hal + ' ' + oname;
                    }
                }
                if (typeInfo.type === 'органическое' || typeInfo.type === 'органическое (сложное)') {
                    const c = counts['C'] || 0, h = counts['H'] || 0;
                    if (c === 1 && h >= 4 && !hasO) return 'Метан';
                    if (c === 1 && h >= 4 && hasO) return 'Метанол';
                    if (c === 2 && h >= 6 && !hasO) return 'Этан';
                    if (c === 2 && h >= 6 && hasO) return 'Этанол';
                    if (c === 3 && h >= 8 && !hasO) return 'Пропан';
                    if (c === 3 && h >= 8 && hasO) return 'Пропанол';
                    if (c === 6 && h >= 12) {
                        if (hasO && h === 12) return 'Фенол';
                        if (!hasO && h === 6) return 'Бензол';
                        return 'Циклогексан';
                    }
                    if (c >= 4 && !hasO) {
                        const pref = ['','Мет','Эт','Проп','Бут','Пент','Гекс','Гепт','Окт','Нон','Дек'];
                        const p = c < pref.length ? pref[c] : `C${c}`;
                        if (h === c * 2 + 2) return p + 'ан';
                        if (h === c * 2) return p + 'ен';
                        if (h === c * 2 - 2) return p + 'ин';
                        return `Углеводород C${c}H${h}`;
                    }
                    const parts = unique.map(s => (elementData[s]?.rus || s) + (counts[s] > 1 ? `(${counts[s]})` : ''));
                    return `Органическое: ${parts.join('+')}`;
                }
                const parts = unique.map(s => (elementData[s]?.rus || s) + (counts[s] > 1 ? `(${counts[s]})` : ''));
                return parts.join(' + ');
            }

            function applyCoefficient(comp, coeff, side) {
                const tokens = tokenize(comp);
                const counts = {};
                let i = 0;
                while (i < tokens.length) {
                    const sym = tokens[i];
                    let count = 1;
                    if (i+1 < tokens.length && !isNaN(tokens[i+1])) { count = parseInt(tokens[i+1]); i++; }
                    counts[sym] = (counts[sym] || 0) + count;
                    i++;
                }
                if (side === 'left') return `${coeff}${comp}`;
                let result = '';
                const sorted = Object.keys(counts).sort();
                for (const sym of sorted) {
                    result += sym;
                    const nc = counts[sym] * coeff;
                    if (nc > 1) result += nc;
                }
                return result;
            }

            // ---- DOM ----
            const workspace = document.getElementById('workspace');
            const grid = document.getElementById('periodicGrid');
            const coeffGrid = document.getElementById('coefficientGrid');
            const clearBtn = document.getElementById('clearBtn');
            const compoundCountEl = document.getElementById('compoundCount');
            let chemObjects = [];

            // ---- ЗАПОЛНЯЕМ ТАБЛИЦУ ----
            const positions = {};
            elementsData.forEach(el => { positions[el.period + '-' + el.groupNum] = el; });
            for (let p = 1; p <= 7; p++) {
                for (let g = 1; g <= 18; g++) {
                    const el = positions[p + '-' + g];
                    const cell = document.createElement('div');
                    cell.className = 'element-cell';
                    if (el) {
                        cell.classList.add(el.color);
                        cell.innerHTML = `<span class="el-number">${el.num}</span><span class="el-symbol">${el.sym}</span><span class="el-name">${el.name}</span>`;
                        cell.dataset.symbol = el.sym;
                    } else {
                        cell.style.background = 'transparent'; cell.style.boxShadow = 'none'; cell.style.cursor = 'default'; cell.style.pointerEvents = 'none';
                    }
                    grid.appendChild(cell);
                }
            }

            // ---- КОЭФФИЦИЕНТЫ ----
            for (let i = 1; i <= 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'coeff-cell';
                cell.textContent = i;
                cell.dataset.value = i;
                coeffGrid.appendChild(cell);
            }

            // ---- СОЗДАНИЕ ОБЪЕКТА ----
            function createChemObject(symbol, x, y, comp) {
                const el = document.createElement('div');
                el.className = 'chem-object';
                const composition = comp || symbol;
                const display = composition.length > 15 ? composition.substring(0, 12) + '…' : composition;
                el.textContent = display;
                el.dataset.symbol = symbol;
                el.dataset.composition = composition;
                el.dataset.fullComposition = composition;

                const tokens = tokenize(composition);
                const unique = new Set(tokens);
                const allMetals = tokens.every(sym => { const d = elementData[sym]; return d && d.type === 'металл'; });
                if (allMetals && tokens.length >= 2) el.classList.add('alloy');
                else if (unique.size >= 6) el.classList.add('mega-compound');
                else if (composition.length > 2) el.classList.add('compound');

                el.style.left = x + 'px';
                el.style.top = y + 'px';
                workspace.appendChild(el);
                chemObjects.push(el);
                attachDragEvents(el);
                updateStats();
                return el;
            }

            function createCoefficient(value, x, y) {
                const el = document.createElement('div');
                el.className = 'chem-object coefficient';
                el.textContent = value;
                el.dataset.coefficient = value;
                el.dataset.type = 'coefficient';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                workspace.appendChild(el);
                chemObjects.push(el);
                attachDragEvents(el);
                return el;
            }

            function updateStats() {
                const compounds = chemObjects.filter(el => {
                    if (el.dataset.type === 'coefficient') return false;
                    const comp = el.dataset.composition || '';
                    return comp.length > 1;
                });
                compoundCountEl.textContent = compounds.length;
            }

            function removeObject(el) {
                const idx = chemObjects.indexOf(el);
                if (idx !== -1) chemObjects.splice(idx, 1);
                if (el.parentNode) el.parentNode.removeChild(el);
                updateStats();
            }

            function pushAway(el) {
                const elRect = el.getBoundingClientRect();
                const wsRect = workspace.getBoundingClientRect();
                const cx = elRect.left + elRect.width/2, cy = elRect.top + elRect.height/2;
                let dx = 0, dy = 0;
                for (let other of chemObjects) {
                    if (other === el) continue;
                    const or = other.getBoundingClientRect();
                    const ocx = or.left + or.width/2, ocy = or.top + or.height/2;
                    const ddx = ocx - cx, ddy = ocy - cy;
                    const dist = Math.sqrt(ddx*ddx + ddy*ddy);
                    if (dist < 120 && dist > 1) {
                        const force = (120 - dist) / 120 * 2;
                        dx -= Math.cos(Math.atan2(ddy, ddx)) * force;
                        dy -= Math.sin(Math.atan2(ddy, ddx)) * force;
                    }
                }
                if (dx !== 0 || dy !== 0) {
                    let nx = (parseFloat(el.style.left) || 0) + dx * 12;
                    let ny = (parseFloat(el.style.top) || 0) + dy * 12;
                    nx = Math.max(0, Math.min(wsRect.width - el.offsetWidth, nx));
                    ny = Math.max(0, Math.min(wsRect.height - el.offsetHeight, ny));
                    el.style.left = nx + 'px';
                    el.style.top = ny + 'px';
                }
            }

            function checkAndMerge(draggedEl) {
                if (draggedEl.dataset.type === 'coefficient') {
                    const coeff = parseInt(draggedEl.dataset.coefficient);
                    const dragRect = draggedEl.getBoundingClientRect();
                    const dragCenterX = (dragRect.left + dragRect.right)/2;
                    let targetFound = false;
                    for (let other of chemObjects) {
                        if (other === draggedEl || other.dataset.type === 'coefficient') continue;
                        const or = other.getBoundingClientRect();
                        const overlap = !(dragRect.right < or.left || dragRect.left > or.right || dragRect.bottom < or.top || dragRect.top > or.bottom);
                        if (!overlap) continue;
                        const otherCenterX = (or.left + or.right)/2;
                        const side = dragCenterX < otherCenterX ? 'left' : 'right';
                        const comp = other.dataset.composition || other.dataset.symbol;
                        const newComp = applyCoefficient(comp, coeff, side);
                        if (isValidCompound(newComp) || newComp.length === comp.length + 1) {
                            const wsRect = workspace.getBoundingClientRect();
                            const nx = Math.max(0, Math.min(wsRect.width - 60, (or.left + or.right)/2 - 30 - wsRect.left));
                            const ny = Math.max(0, Math.min(wsRect.height - 30, (or.top + or.bottom)/2 - 15 - wsRect.top));
                            removeObject(draggedEl);
                            removeObject(other);
                            const first = newComp[0] || '?';
                            const ne = createChemObject(first, nx, ny, newComp);
                            const tokens = tokenize(newComp);
                            let maxV = 0;
                            for (const s of tokens) { const v = valenceMap[s] || 0; if (v > maxV) maxV = v; }
                            valenceMap[newComp] = maxV;
                            targetFound = true;
                            break;
                        }
                    }
                    if (!targetFound && draggedEl.parentNode) {
                        draggedEl.classList.add('reject');
                        pushAway(draggedEl);
                        setTimeout(() => { if (draggedEl.parentNode) draggedEl.classList.remove('reject'); }, 1500);
                    }
                    return;
                }

                const dragRect = draggedEl.getBoundingClientRect();
                const dragComp = draggedEl.dataset.composition || draggedEl.dataset.symbol;
                let merged = false;
                for (let other of chemObjects) {
                    if (other === draggedEl || other.dataset.type === 'coefficient') continue;
                    const or = other.getBoundingClientRect();
                    const overlap = !(dragRect.right < or.left || dragRect.left > or.right || dragRect.bottom < or.top || dragRect.top > or.bottom);
                    if (!overlap) continue;
                    const otherComp = other.dataset.composition || other.dataset.symbol;
                    const newComp = tryMerge(dragComp, otherComp);
                    if (newComp) {
                        const wsRect = workspace.getBoundingClientRect();
                        const nx = Math.max(0, Math.min(wsRect.width - 60, (dragRect.left + dragRect.right)/2 - 30 - wsRect.left));
                        const ny = Math.max(0, Math.min(wsRect.height - 30, (dragRect.top + dragRect.bottom)/2 - 15 - wsRect.top));
                        removeObject(draggedEl);
                        removeObject(other);
                        const first = newComp[0] || '?';
                        const ne = createChemObject(first, nx, ny, newComp);
                        const tokens = tokenize(newComp);
                        let maxV = 0;
                        for (const s of tokens) { const v = valenceMap[s] || 0; if (v > maxV) maxV = v; }
                        valenceMap[newComp] = maxV;
                        merged = true;
                        break;
                    }
                }
                if (!merged && draggedEl.parentNode) {
                    draggedEl.classList.add('reject');
                    pushAway(draggedEl);
                    setTimeout(() => { if (draggedEl.parentNode) draggedEl.classList.remove('reject'); }, 1500);
                }
                return merged;
            }

            // ---- ПЕРЕТАСКИВАНИЕ (touch + mouse) ----
            function attachDragEvents(el) {
                let isDragging = false, startX, startY, origX, origY;

                const onStart = (e) => {
                    e.preventDefault();
                    const ev = e.touches ? e.touches[0] : e;
                    isDragging = true;
                    el.classList.add('dragging');
                    const rect = el.getBoundingClientRect();
                    origX = rect.left; origY = rect.top;
                    startX = ev.clientX; startY = ev.clientY;
                    el.style.zIndex = 100;
                    el.classList.remove('reject');

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd, { passive: false });
                };

                const onMove = (e) => {
                    e.preventDefault();
                    if (!isDragging) return;
                    const ev = e.touches ? e.touches[0] : e;
                    const dx = ev.clientX - startX, dy = ev.clientY - startY;
                    const wsRect = workspace.getBoundingClientRect();
                    let nx = origX + dx - wsRect.left, ny = origY + dy - wsRect.top;
                    nx = Math.max(0, Math.min(wsRect.width - el.offsetWidth, nx));
                    ny = Math.max(0, Math.min(wsRect.height - el.offsetHeight, ny));
                    el.style.left = nx + 'px';
                    el.style.top = ny + 'px';
                };

                const onEnd = (e) => {
                    if (isDragging) {
                        isDragging = false;
                        el.classList.remove('dragging');
                        el.style.zIndex = 20;
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onEnd);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onEnd);
                        checkAndMerge(el);
                    }
                };

                el.addEventListener('mousedown', onStart);
                el.addEventListener('touchstart', onStart, { passive: false });
            }

            // ---- КЛИКИ: СОЗДАНИЕ ----
            grid.addEventListener('click', (e) => {
                const cell = e.target.closest('.element-cell[data-symbol]');
                if (!cell) return;
                const sym = cell.dataset.symbol;
                const wsRect = workspace.getBoundingClientRect();
                const x = 20 + Math.random() * (wsRect.width - 60);
                const y = 20 + Math.random() * (wsRect.height - 60);
                createChemObject(sym, x, y, sym);
            });
            grid.addEventListener('touchstart', (e) => {
                const cell = e.target.closest('.element-cell[data-symbol]');
                if (!cell) return;
                const sym = cell.dataset.symbol;
                const wsRect = workspace.getBoundingClientRect();
                const x = 20 + Math.random() * (wsRect.width - 60);
                const y = 20 + Math.random() * (wsRect.height - 60);
                createChemObject(sym, x, y, sym);
            }, { passive: true });

            coeffGrid.addEventListener('click', (e) => {
                const cell = e.target.closest('.coeff-cell');
                if (!cell) return;
                const val = parseInt(cell.dataset.value);
                const wsRect = workspace.getBoundingClientRect();
                const x = 20 + Math.random() * (wsRect.width - 60);
                const y = 20 + Math.random() * (wsRect.height - 60);
                createCoefficient(val, x, y);
            });
            coeffGrid.addEventListener('touchstart', (e) => {
                const cell = e.target.closest('.coeff-cell');
                if (!cell) return;
                const val = parseInt(cell.dataset.value);
                const wsRect = workspace.getBoundingClientRect();
                const x = 20 + Math.random() * (wsRect.width - 60);
                const y = 20 + Math.random() * (wsRect.height - 60);
                createCoefficient(val, x, y);
            }, { passive: true });

            clearBtn.addEventListener('click', () => {
                for (let i = chemObjects.length - 1; i >= 0; i--) {
                    const el = chemObjects[i];
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
                chemObjects = [];
                for (const key in valenceMap) { if (key.length > 2) delete valenceMap[key]; }
                updateStats();
            });

            // ---- ДЕМО ----
            function initDemo() {
                const wsRect = workspace.getBoundingClientRect();
                const demo = ['H','O','C','N','Cl','Fe','Mg','Cu','Al','Ti'];
                const pos = [
                    {x:40,y:40},{x:100,y:40},{x:160,y:40},{x:220,y:40},{x:280,y:40},
                    {x:40,y:100},{x:100,y:100},{x:160,y:100},{x:220,y:100},{x:280,y:100}
                ];
                demo.forEach((s,i) => { const p = pos[i] || {x:50+i*30,y:50+i*20}; createChemObject(s, p.x, p.y, s); });
                setTimeout(() => {
                    const compounds = [
                        { comp: 'FeMg', label: 'Fe-Mg' }, { comp: 'CuAl', label: 'Cu-Al' },
                        { comp: 'H2O', label: 'H₂O' }, { comp: 'NaCl', label: 'NaCl' },
                        { comp: 'C2H5OH', label: 'C₂H₅OH' }, { comp: 'H2SO4', label: 'H₂SO₄' },
                        { comp: 'Fe2O3', label: 'Fe₂O₃' }
                    ];
                    compounds.forEach((c, i) => {
                        const x = 30 + i * 95;
                        const y = 220;
                        const el = createChemObject(c.comp[0], x, y, c.comp);
                        el.textContent = c.label;
                        const tokens = tokenize(c.comp);
                        const allMetals = tokens.every(sym => { const d = elementData[sym]; return d && d.type === 'металл'; });
                        if (allMetals && tokens.length >= 2) el.classList.add('alloy');
                        else el.classList.add('compound');
                    });
                }, 300);
            }
            setTimeout(initDemo, 200);
        })();
    </script>
</body>
